[project]
name = "gw2walls"
version = "1.0.0"
description = "Download wallpapers from Guild Wars 2"
readme = "README.md"
authors = [{ name = "Josh Schneider", email = "josh.schneider@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["beautifulsoup4>=4.15.0", "requests>=2.34.2"]

[project.scripts]
gw2walls = "GW2Walls"

[dependency-groups]
dev = ["ruff>=0.17.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "C90",  # mccabe
    "I",    # iSort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "FLY",  # flynt
    "PERF", # perflint
    "FURB", # refurb
    "RUF",  # ruff
]

[tool.ruff.lint.pydocstyle]
convention = "google"
